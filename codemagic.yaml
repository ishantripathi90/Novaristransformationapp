workflows:
  android-debug:
    name: Novaris Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          cd NovarisAndroidStudio
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - NovarisAndroidStudio/app/build/outputs/apk/debug/*.apk
